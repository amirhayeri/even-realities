<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio HUD</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #46ff78; font: 14px/1.4 system-ui, sans-serif; }
  #phone { padding: 16px; max-width: 640px; margin: 0 auto; }
  #status { opacity: .7; margin-bottom: 8px; }
  #preview { display: none; width: 576px; max-width: 100%; aspect-ratio: 2 / 1; background: #000; border: 1px solid #143; image-rendering: pixelated; }
  body.preview #preview { display: block; }
  #hint { display: none; opacity: .6; margin-top: 8px; }
  body.preview #hint { display: block; }
</style>
</head>
<body>
<div id="phone">
  <div id="status">Starting…</div>
  <canvas id="preview" width="576" height="288" aria-label="Glasses preview"></canvas>
  <div id="hint">Browser preview. Click = tap. M = menu. U = look-up. No Even app bridge found, so data is mocked.</div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
