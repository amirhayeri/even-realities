# XcodeGen spec. `brew install xcodegen && xcodegen` writes BioHUDWatch.xcodeproj.
name: BioHUDWatch
options:
  bundleIdPrefix: tech.bioconscious
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"   # exported by make-config.sh from ../app/.env; or set in Xcode
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BioHUDWatch:
    type: application
    platform: watchOS
    sources:
      - path: BioHUDWatch
        excludes: [Config.example.swift]
    entitlements:
      path: BioHUDWatch/BioHUDWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: BioHUDWatch/Info.plist
      properties:
        CFBundleDisplayName: Bio HUD
        WKApplication: true
        WKWatchOnly: true
        NSHealthShareUsageDescription: Reads heart rate, steps, energy and distance during your workout to show them on your glasses.
        NSHealthUpdateUsageDescription: Saves the workout to Health so your rings and history fill as usual.
        WKBackgroundModes: [workout-processing]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${WATCH_BUNDLE_ID}"
        INFOPLIST_KEY_CFBundleDisplayName: Bio HUD
        TARGETED_DEVICE_FAMILY: "4"
