name = "even-hud-endpoint"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Route it at hud.bioconscious.tech once the DNS record exists in Cloudflare:
# routes = [{ pattern = "hud.bioconscious.tech", custom_domain = true }]

[[kv_namespaces]]
binding = "HUD"
id = "REPLACE_WITH_wrangler_kv_namespace_create_HUD"
preview_id = "REPLACE_WITH_preview_id"

[vars]
BASE_URL = "https://hud.bioconscious.tech"
SPOTIFY_PLAYLIST_URI = "spotify:playlist:REPLACE_ME"
WEATHER_LAT = "49.2827"
WEATHER_LON = "-123.1207"
WEATHER_CITY = "Vancouver"
HR_MAX = "185"
ZONE_GOAL_SEC = "1800"
# GLUCOSE_URL = "https://.../latest.json"   # optional, see README for the shape

# Secrets (wrangler secret put ...): HUD_TOKEN, SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
