name = "even-hud-endpoint"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Template. setup.sh copies this to wrangler.toml (git-ignored) and fills the values.
# Optional custom domain: routes = [{ pattern = "hud.example.com", custom_domain = true }]

[[kv_namespaces]]
binding = "HUD"
id = "KV_NAMESPACE_ID"

[vars]
BASE_URL = "https://WORKER_URL"
SPOTIFY_PLAYLIST_URI = "spotify:playlist:PLAYLIST_ID"
WEATHER_LAT = "LAT"
WEATHER_LON = "LON"
WEATHER_CITY = "CITY"
HR_MAX = "HRMAX"
KV_WRITE_MIN_MS = "5000"     # min ms between KV writes from /health (free KV: 1,000 writes/day). Paid plan: "0"
# SPOTIFY_DEVICE_NAME = "Amir's iPhone"   # optional: pin playback to one device by its exact Spotify name
ZONE_GOAL_SEC = "1800"
# GLUCOSE_URL = "https://.../latest.json"   # optional, see README for the shape

# Morning HUD (docs/morning.md)
TZ = "America/Toronto"                    # your zone, decides what "today" is
VIP_EMAILS = ""                            # "sarah@acme.com, @investor.vc" — mail from these is a VIP card
# MAIL_QUERY = "newer_than:1d -category:promotions -category:social"   # Gmail search for the Mail card

# Secrets (wrangler secret put ...): HUD_TOKEN, SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET,
# and for Morning HUD: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
